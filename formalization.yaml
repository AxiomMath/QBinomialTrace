# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json

version: "v0.4"

project:
  name: "QBinomialTrace"
  authors: [Kenny Lau]
  description: >
    `QBinomialTrace` is a formal proof of the dominance results that reduce the Han-Xiong
    conjecture on integer traces of fractional Gaussian binomial coefficients to a family of unit
    fractions, from *On a conjecture of Han and Xiong for fractional Gaussian binomial
    coefficients* (arXiv:2608.00323). It proves Theorem 1.3, Corollary 1.4 and Theorem 1.5. The
    Lean files were generated by AxiomProver, Axiom Math's in-house theorem proving system.
  responsible_maintainers: [Kenny Lau]
  license: "MIT"

repository:
  role: "substantive-development"

sources:
  - title: "On a conjecture of Han and Xiong for fractional Gaussian binomial coefficients"
    authors: [Ken Ono]
    id: "https://arxiv.org/abs/2608.00323"
    type: "article"
    location: "Theorem 1.3, Corollary 1.4, Theorem 1.5"
    relationship: "formalizes"
    note: >
      Formalizes support dominance, the half-line case it yields, and the canonical reduction of
      the conjecture to the unit fractions $1/(2m)$.

classification:
  arxiv: [math.CO]
  msc2020: [05A20, 11P84, 68V15, 68V20]

status:
  scope: >
    Theorem 1.3 for every pair of positive rationals $u \le r$ in lowest terms whose denominators
    satisfy the hypotheses (6), Corollary 1.4 for every rational $r \ge 1/2$, and Theorem 1.5 in
    all three of its parts - the core dominance (8), the equivalence with the unit family (9), and
    the finite range (10) for fixed $k$ - for every positive rational $r$ and every $k \ge 1$.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Quot.sound, Classical.choice]
  main_results:
  - declaration: "support_dominance"
    file: "QBinomialTrace/solution.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "comparator.json"
  - declaration: "half_line_dominance"
    file: "QBinomialTrace/solution.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "comparator.json"
  - declaration: "core_dominance"
    file: "QBinomialTrace/solution.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "comparator.json"
  - declaration: "HX_iff_unit_family"
    file: "QBinomialTrace/solution.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "comparator.json"
  - declaration: "HXk_iff_UFk"
    file: "QBinomialTrace/solution.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "comparator.json"
  - declaration: "finite_unit_family_check"
    file: "QBinomialTrace/solution.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "comparator.json"

automation:
  methods:
    - method: "autonomous"
      models: [AxiomProver]

review:
  status: "author-verified"
  reviewers: [Kenny Lau]
  notes: >
    The formal challenge in `QBinomialTrace/problem.lean` was checked against the source paper by
    an author of that paper.

alignment:
  statements:
    - source: "On a conjecture of Han and Xiong for fractional Gaussian binomial coefficients (Theorem 1.3)"
      lean: "support_dominance"
      module: "QBinomialTrace.solution"
      status: "Proved."
    - source: "On a conjecture of Han and Xiong for fractional Gaussian binomial coefficients (Corollary 1.4)"
      lean: "half_line_dominance"
      module: "QBinomialTrace.solution"
      status: "Proved."
    - source: "On a conjecture of Han and Xiong for fractional Gaussian binomial coefficients (Theorem 1.5, equation (8))"
      lean: "core_dominance"
      module: "QBinomialTrace.solution"
      status: "Proved."
    - source: "On a conjecture of Han and Xiong for fractional Gaussian binomial coefficients (Theorem 1.5, equation (9))"
      lean: "HX_iff_unit_family"
      module: "QBinomialTrace.solution"
      status: "Proved."
    - source: "On a conjecture of Han and Xiong for fractional Gaussian binomial coefficients (Theorem 1.5, equation (9), for a fixed $k$)"
      lean: "HXk_iff_UFk"
      module: "QBinomialTrace.solution"
      status: "Proved."
    - source: "On a conjecture of Han and Xiong for fractional Gaussian binomial coefficients (Theorem 1.5, equation (10))"
      lean: "finite_unit_family_check"
      module: "QBinomialTrace.solution"
      status: "Proved."
